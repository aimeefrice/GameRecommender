<!DOCTYPE html>
<html>


<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width">
 <title>Login</title>
 <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-pink-100 min-h-screen flex items-center justify-center p-4">
 <div class="w-full max-w-md bg-white rounded-3xl shadow-lg p-8">
   <h1 class="text-4xl font-bold mb-4">Login to your account</h1>
  
   <div class="flex items-center gap-2 mb-8">
     <p class="text-gray-600">Don't have an account?</p>
     <a href="/frontend/pages/signup.html" class="text-pink-500 hover:text-pink-600">Sign up</a>
   </div>


   <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
     <input
       type="email"
       id="email"
       placeholder="Email"
       required
       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-pink-500"
     />
     <input
       type="password"
       id="password"
       placeholder="Password"
       required
       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-pink-500"
     />
     <button
       type="submit"
       class="w-full bg-pink-500 text-white py-3 rounded-xl hover:bg-pink-600 transition"
     >
       Login
     </button>
   </form>


   <div class="my-6 text-center text-gray-500">
     <p>Or login with</p>
   </div>


   <div class="flex gap-4 justify-center">
     <button class="flex items-center justify-center gap-2 px-6 py-2 border border-gray-200 rounded-xl hover:bg-gray-50 transition w-full">
       <img src="/frontend/images/glogo.png" class="h-5 w-5">
       <span class="text-gray-700">Google</span>
     </button>
     <button class="flex items-center justify-center gap-2 px-6 py-2 border border-gray-200 rounded-xl hover:bg-gray-50 transition w-full">
       <img src="/frontend/images/alogo.png" class="h-5 w-5">
       <span class="text-gray-700">Apple</span>
     </button>
   </div>
 </div>


 <script>
   function handleLogin(event) {
     event.preventDefault();
    
     const email = document.getElementById('email').value;
     const password = document.getElementById('password').value;


     // Get users from localStorage
     const users = JSON.parse(localStorage.getItem('users') || '[]');
    
     // Find user with matching credentials
     const user = users.find(u => u.email === email && u.password === password);


     if (user) {
       localStorage.setItem('currentUser', JSON.stringify(user));
       alert('Login successful!');
       window.location.href = '/frontend/pages/reccomender.html';
     } else {
       alert('Invalid email or password!');
     }
   }


   // Check if user is already logged in
   window.onload = function() {
     const currentUser = localStorage.getItem('currentUser');
     if (currentUser) {
       window.location.href = '/frontend/pages/reccomender.html';
     }
   }
 </script>
</body>
</html>
