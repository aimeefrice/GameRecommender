<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Products</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 ">
            <div class="flex justify-between">
                <div class="flex space-x-7">
                    <div>
                        <a href="/frontend/pages/index.html" class="flex items-center py-4">
                            <span class="font-semibold text-gray-700 text-lg">Game2Play</span>
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="/frontend/pages/info.html" class="py-4 px-2 text-gray-500 hover:text-gray-700 transition duration-300">Information</a>
                    <a href="/frontend/pages/reccomender.html" class="py-4 px-2 text-gray-500 hover:text-gray-700 transition duration-300">Recommendation</a>
                    <a href="/frontend/pages/login.html" class="py-4 px-2 text-gray-500 hover:text-gray-700 transition duration-300">Login/Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <section> 
        <div class="h-screen bg-cyan-50 w-screen">
            <p class="p-8 font-semibold text-3xl">Latest Gaming News:</p>
            <div id="news-container" class="flex flex-col ml-8">
                <!-- Main news section -->
                <div id="main-news" class="flex w-full mb-8">
                    <!-- Main news content will be populated here -->
                </div>
                <!-- Grid news section -->
                <div id="grid-news" class="grid grid-cols-3 gap-6 pb-8 pr-8">
                    <!-- Grid news content will be populated here -->
                </div>
            </div>
        </div>
    </section>

    <script>
        async function fetchGamingNews() {
            try {
                const response = await fetch('http://localhost:5000/get-news');
                
                const data = await response.json();
                
                if (data.success) {
                    displayNews(data.news);
                } else {
                    throw new Error(data.error || 'Failed to fetch news');
                }
            } catch (error) {
                console.error('Error fetching news:', error);
                document.getElementById('news-container').innerHTML = `
                    <div class="text-red-500">
                        Failed to load news. Please try again later.
                    </div>
                `;
            }
        }

        function displayNews(news) {
            const mainNewsContainer = document.getElementById('main-news');
            const gridNewsContainer = document.getElementById('grid-news');
            
            // Create main news item (larger)
            const mainNews = news[0];
            const mainNewsHTML = `
                <div class="flex w-1/2 h-full">
                    <div class="w-1/2 h-1/4">
                        <img class="w-full h-full object-cover" src="${mainNews.thumbnail}" alt="${mainNews.title}">
                    </div>
                    <div class="ml-4">
                        <h2 class="font-bold text-xl">${mainNews.title}</h2>
                        <p>Genre: ${mainNews.genre}</p>
                        <p>Platform: ${mainNews.platform}</p>
                        <p class="mt-2">${mainNews.short_description}</p>
                    </div>
                </div>
                <div class="flex flex-col gap-2 w-1/2 h-full">
                    ${news.slice(1, 3).map(game => `
                        <div class="flex">
                            <div class="h-1/2 w-1/4">
                                <img class="w-full h-full object-cover" src="${game.thumbnail}" alt="${game.title}">
                            </div>
                            <div class="ml-4">
                                <h3 class="font-bold">${game.title}</h3>
                                <p>Genre: ${game.genre}</p>
                                <p>${game.short_description.substring(0, 100)}...</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Create grid news items (next 9)
            const gridNewsHTML = news.slice(3, 12).map(game => `
                <div class="bg-white rounded-lg shadow-md p-4">
                    <div class="h-40 w-full mb-4">
                        <img class="w-full h-full object-cover rounded" src="${game.thumbnail}" alt="${game.title}">
                    </div>
                    <h3 class="font-bold text-lg mb-2">${game.title}</h3>
                    <p class="text-sm text-gray-600">Genre: ${game.genre}</p>
                    <p class="text-sm text-gray-600">Platform: ${game.platform}</p>
                    <p class="mt-2 text-sm">${game.short_description.substring(0, 80)}...</p>
                </div>
            `).join('');

            mainNewsContainer.innerHTML = mainNewsHTML;
            gridNewsContainer.innerHTML = gridNewsHTML;
        }

        // Fetch news when page loads
        fetchGamingNews();
    </script>
</body>
</html>
