<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="/frontend/styles/login.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <!-- Container -->
  <div class="Outside_cont">
  <!-- Left Cont -->
    <div class="Left_cont"> 
      <div class="top_row">
        <img class="logo" src="/pictures/logo_white.png">
        <h2>Welcome</h2>
        <button class="button1"><a href="/">Back to website →</a></button>
      </div>
      <!-- Bottom Text-->
      <div class="bottom_row">
        <h3>Creating Memories</h3>
      </div>
    </div>
    <!-- Right Cont  -->
    <div class="Right_cont">
      <!-- Header -->
      <h1>Create an account</h1>
      <!-- Descipt  -->
      <div class="Log_in">
        <p>Already have an account?</p>
        <a href="/">Log in</a>
      </div>
      <!--Form  -->
      <form id="signupForm" onsubmit="handleSignup(event)">
       <!-- Cont for first button pair -->
        <div class="First_row">
          <label>
            <input type="text" id="firstName" placeholder="First Name" required/>
            <input type="text" id="lastName" placeholder="Last Name" required/>
          </label>
        </div>
        <!-- Email input  -->
        <div class="Second_row">
          <label>
          <input type="email" id="email" placeholder="Email" required/>
          </label>
        </div>
        <!-- Password input -->
        <div class="Third_row">
          <label>
          <input type="password" id="password" placeholder="Password" required/>
          </label>
        </div>
        <!-- Checkout + TOS  -->
        <div class="Fourth_row">
          <input type="checkbox" id="terms" required>
          <p>I agree to the <a href="/">Terms & Conditions</a> </p>
        </div>
        <!-- submit button -->
        <input type="submit" value="Submit">
      </form>
    <!-- Register with p tag -->
      <div class="tag">
       <h6><span></spam>Or register with</span></h6>
      </div>
    <!-- Two button COntainer  -->
      <div class="buttons">
        <button class="button2"><img src="/frontend/images/glogo.png" style="height:40%;width:13%;"><a href="/">Google</a></button>
        <button class="button3"><img src="/frontend/images/alogo.png" style="height:70%;width:23%;"><a href="/">Apple</a></button>
      </div>
    </div>
</div>

<script>
    function handleSignup(event) {
        event.preventDefault();
        
        const userData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        // Store user data in localStorage
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        users.push(userData);
        localStorage.setItem('users', JSON.stringify(users));

        // Store current user
        localStorage.setItem('currentUser', JSON.stringify(userData));

        // Redirect to home page or dashboard
        alert('Account created successfully!');
        window.location.href = '/'; // Replace with your dashboard page
    }
</script>
</body>
</html>
